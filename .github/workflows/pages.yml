name: Publier le portail

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les outils de vérification
        run: npm ci
      - name: Vérifier le portail
        run: npm test
      - name: Vérifier les votes collectifs
        run: npm run test:live
      - name: Configurer Pages
        uses: actions/configure-pages@v5
      - name: Préparer le site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
