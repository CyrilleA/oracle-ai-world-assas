<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
<title id="title">Du System of Record au System of Outcome</title><desc id="desc">À gauche, le système enregistre 68 coffrets prêts et 12 bloqués. À droite, des agents coordonnent les actions pour viser 80 coffrets livrés avant 19 heures, dans les limites fixées par les humains. Les deux reposent sur les mêmes données et transactions fiables.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#bf9c61"/></marker></defs>
<rect width="1280" height="650" rx="22" fill="#f7f5f0"/>
<g font-family="Arial,sans-serif">
<rect x="20" y="20" width="560" height="475" rx="20" fill="#fff" stroke="#dce2d9"/>
<rect x="620" y="20" width="640" height="475" rx="20" fill="#243735"/>
<text x="52" y="65" font-size="16" letter-spacing="2" fill="#68766e">ENREGISTRER ET FIABILISER</text>
<text x="52" y="109" font-size="32" font-weight="700" fill="#243735">System of Record</text>
<text x="52" y="151" font-size="24" fill="#243735">« Quelle est la situation ? »</text>
<rect x="52" y="179" width="496" height="161" rx="12" fill="#edf0e7"/>
<g fill="#243735"><text x="76" y="212" font-size="17" font-weight="700">ÉTAT DE LA COMMANDE · 80 COFFRETS</text>
<text x="76" y="266" font-size="38" font-weight="700">68</text><text x="139" y="264" font-size="22">prêts</text>
<text x="310" y="266" font-size="38" font-weight="700">12</text><text x="373" y="264" font-size="22">bloqués</text>
<text x="76" y="312" font-size="20">Stocks, achats et historique à jour</text></g>
<path d="M300 351V373" stroke="#bf9c61" stroke-width="3" marker-end="url(#arrow)"/>
<g stroke="#306661" fill="none" stroke-width="2.5"><circle cx="93" cy="400" r="13"/><path d="M70 440v-11q23-29 46 0v11"/><rect x="141" y="389" width="47" height="45" rx="4"/><path d="M151 401h27m-27 10h27m-27 10h17"/></g>
<text x="211" y="405" font-size="21" fill="#243735">Équipes et workflows</text>
<text x="211" y="436" font-size="20" fill="#68766e">pilotent les opérations.</text>
<text x="652" y="65" font-size="16" letter-spacing="2" fill="#b9d0c1">AGIR VERS UN OBJECTIF</text>
<text x="652" y="109" font-size="32" font-weight="700" fill="#fff">System of Outcome</text>
<text x="652" y="151" font-size="24" fill="#fff">« Comment atteindre le résultat ? »</text>
<rect x="652" y="179" width="576" height="59" rx="10" fill="#3b5752"/>
<text x="940" y="217" text-anchor="middle" font-size="24" font-weight="700" fill="#efd492">OBJECTIF : 80 COFFRETS AVANT 19 H</text>
<g fill="#fff" font-size="19" text-anchor="middle"><rect x="652" y="266" width="164" height="82" rx="10" fill="#3b5752"/><text x="734" y="299" font-weight="700">Agent Stocks</text><text x="734" y="328">Détecter l’écart</text>
<rect x="858" y="266" width="164" height="82" rx="10" fill="#3b5752"/><text x="940" y="299" font-weight="700">Agent Achats</text><text x="940" y="328">Trouver une option</text>
<rect x="1064" y="266" width="164" height="82" rx="10" fill="#3b5752"/><text x="1146" y="299" font-weight="700">Agent Logistique</text><text x="1146" y="328">Adapter le plan</text></g>
<g stroke="#bf9c61" stroke-width="3" fill="none" marker-end="url(#arrow)"><path d="M821 308h30"/><path d="M1027 308h30"/><path d="M1146 358v23H744v-23"/></g>
<text x="940" y="417" text-anchor="middle" font-size="22" fill="#fff">Agir si autorisé · Mesurer · Réajuster</text>
<text x="940" y="454" text-anchor="middle" font-size="18" fill="#b9d0c1">Budget dépassé ? Une validation humaine est requise.</text>
<rect x="20" y="518" width="1240" height="53" rx="10" fill="#e7ece3"/>
<g stroke="#306661" fill="none" stroke-width="2"><ellipse cx="55" cy="537" rx="14" ry="5"/><path d="M41 537v14c0 7 28 7 28 0v-14"/></g>
<text x="88" y="552" font-size="21" fill="#243735">MÊME SOCLE FIABLE : données · transactions · droits · preuves</text>
<text x="640" y="614" text-anchor="middle" font-size="23" font-weight="700" fill="#be4939">Les humains fixent l’objectif, les limites et les décisions à valider.</text>
</g></svg>